name: Project CI

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - 'main'

permissions:
    contents: read

jobs:
    Run-Test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      server/package-lock.json
                      infra/package-lock.json

            - name: Install Dependencies
              run: |
                  npm ci
                  npm ci --prefix server
                  npm ci --prefix infra

            - name: Run Frontend Tests
              run: npm run test

            - name: Build Frontend
              run: npm run build

            - name: Typecheck + Test Backend
              working-directory: server
              run: |
                  npm run typecheck
                  npm test

            - name: Synthesize Infrastructure
              working-directory: infra
              run: |
                  npm run typecheck
                  npx cdk synth --quiet

    Deploy-Production:
        needs: Run-Test
        # Only deploy from main, and only once the AWS stack has been bootstrapped
        # and the repo variables below are set (see README "Deploying to AWS").
        if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
        runs-on: ubuntu-latest
        concurrency: deploy-production
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume the AWS role

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      server/package-lock.json
                      infra/package-lock.json

            - name: Install Dependencies
              run: |
                  npm ci
                  npm ci --prefix server
                  npm ci --prefix infra

            - name: Configure AWS Credentials (OIDC, no stored keys)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Deploy Backend + Infrastructure (CDK)
              working-directory: infra
              run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

            - name: Read Stack Outputs
              id: stack
              run: |
                  echo "bucket=$(jq -r '.NpmDepGraph.SiteBucketName' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
                  echo "distribution=$(jq -r '.NpmDepGraph.DistributionId' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
                  echo "url=$(jq -r '.NpmDepGraph.SiteUrl' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"

            - name: Build Frontend
              run: npm run build
              env:
                  VITE_API_URL: /api # CloudFront routes /api/* to API Gateway

            - name: Upload to S3
              run: |
                  # Hashed assets can be cached forever; index.html must always be revalidated.
                  aws s3 sync dist "s3://${{ steps.stack.outputs.bucket }}" --delete \
                      --exclude index.html --cache-control "public,max-age=31536000,immutable"
                  aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
                      --cache-control "no-cache"

            - name: Invalidate CloudFront
              run: |
                  aws cloudfront create-invalidation \
                      --distribution-id "${{ steps.stack.outputs.distribution }}" --paths "/*"
                  echo "Deployed to ${{ steps.stack.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
